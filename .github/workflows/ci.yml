# CI/CD for ExploreTogether (see docs/DEV-SERVER.md).
#
# Every push and pull request: build the solution and run the unit tests.
# Pushes to main (or a manual run): also export the Linux dedicated server and the Windows client with Godot, then
#   - publish the client as a GitHub Release (friends download the latest one), and
#   - deploy the server to the dev server: a self-hosted runner on that machine (labels: self-hosted, linux,
#     explore-dev-server) installs it and restarts the service. Only this job ever runs on the self-hosted runner,
#     and only for pushes to main, never for pull requests.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build ExploreTogether.sln -c Release
      - name: Unit tests
        run: dotnet test tests/ExploreTogether.Core.Tests/ExploreTogether.Core.Tests.csproj -c Release --no-build --logger trx --results-directory test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 14

  export:
    name: Export server and client
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-ci
          key: godot-${{ env.GODOT_VERSION }}-mono-linux
      - name: Install Godot and export templates
        run: bash tools/ci/install-godot.sh "$GODOT_VERSION"
      - name: Export
        run: bash tools/ci/export.sh "$GODOT_VERSION" "${{ github.sha }}"
      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: builds/server
          retention-days: 14
          if-no-files-found: error
      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: builds/ExploreTogether-client-*.zip
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish the client for friends
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-windows
          path: release
      - name: Short commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Dev build ${{ github.run_number }} (${{ steps.sha.outputs.short }})
          make_latest: true
          files: release/*.zip
          body: |
            Windows client for the ExploreTogether dev server, built from ${{ github.sha }}.

            Unzip anywhere and run `ExploreTogether.exe`. In the login screen, enter the server address you were
            given and, the first time, the invite code, then press Register. Always use the latest build: the
            server runs the same commit.

  deploy:
    name: Deploy to the dev server
    needs: export
    runs-on: [self-hosted, linux, explore-dev-server]
    environment: dev-server
    concurrency:
      group: deploy-dev-server
      cancel-in-progress: false
    steps:
      - name: Clean the work folder
        run: rm -rf incoming && mkdir incoming
      - uses: actions/download-artifact@v4
        with:
          name: server-linux
          path: incoming
      - name: Install and restart the server
        run: sudo /opt/exploretogether/bin/deploy "$PWD/incoming" "${{ github.sha }}"
